services:
  frontend:
    image: ghcr.io/smit4k/smit.codes-frontend:${IMAGE_TAG}
    container_name: smit-codes-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/smit4k/smit.codes-backend:${IMAGE_TAG}
    container_name: smit-codes-backend
    restart: unless-stopped
    environment:
      RUST_LOG: info
      SERVER_ADDR: 0.0.0.0:3001
      ANALYTICS_DB_URL: sqlite:./db/analytics.db
      RATE_LIMIT_TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - smit_codes_db:/app/backend/db
      - /opt/smit.codes/content/writing/imgs:/app/backend/content/writing/imgs:ro

volumes:
  smit_codes_db:
