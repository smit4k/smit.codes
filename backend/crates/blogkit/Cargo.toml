[package]
name = "blogkit"
version = "0.1.0"
edition.workspace = true

[features]
default = ["content", "cache", "axum"]
content = ["dep:chrono", "dep:serde", "dep:serde_json", "dep:serde_yaml"]
photos = ["content"]
cache = ["dep:axum", "dep:serde", "dep:serde_json", "dep:sha1"]
analytics = ["dep:axum", "dep:serde", "dep:sqlx", "dep:tracing"]
system = ["dep:serde", "dep:sysinfo"]
rate-limit = ["dep:axum", "dep:tower_governor", "dep:tracing"]
axum = ["dep:axum", "dep:tower-http", "cache", "content"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tower_governor = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
