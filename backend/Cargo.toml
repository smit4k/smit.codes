[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = [
    "fs",
    "cors",
] } # Added "cors" feature
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.37.2"
